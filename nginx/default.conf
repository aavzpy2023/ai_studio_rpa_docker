upstream frontend_upstream {
    server frontend-react:3000;
}

upstream backend_upstream {
    server backend:8000;
}

upstream n8n_upstream {
    server n8n:5678;
}

server {
    listen 80;
    server_name localhost;

    # --- 1. FRONTEND (Default Gateway) ---
    # Cualquier ruta que no coincida con los bloques de abajo (ej. /inventory)
    # será servida por el Frontend, permitiendo que React-Router maneje la UI.
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- 2. UNIFIED API GATEWAY ---
    # Todas las llamadas a /api/auth, /api/inventory, /api/sales, etc.
    # pasan por este túnel único hacia el backend.
    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 3. DEVELOPER TOOLS ---
    location /docs {
        proxy_pass http://backend_upstream/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream/openapi.json;
        proxy_set_header Host $host;
    }

    # --- 4. AUTOMATION (n8n) ---
    location /n8n/ {
        proxy_pass http://n8n_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /n8n;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'href="/' 'href="/n8n/';
        sub_filter 'src="/' 'src="/n8n/';
        sub_filter 'action="/' 'action="/n8n/';
        sub_filter '"/assets/' '"/n8n/assets/';
        sub_filter "'/assets/" "'/n8n/assets/";
        sub_filter '"/rest/' '"/n8n/rest/';
        sub_filter '"/favicon.ico' '"/n8n/favicon.ico';
    }

    location /n8n/assets/ {
        proxy_pass http://n8n_upstream/assets/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /n8n/rest/ {
        proxy_pass http://n8n_upstream/rest/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /n8n;
    }
}