[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpa-aistudio-bot"
version = "0.1.0"
description = "Headless RPA Bot for AI Studio using PyAutoGUI and OpenCV"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "kink>=0.8.0",
    "PyAutoGUI==0.9.54",
    "opencv-python-headless==4.9.0.80",
    "pyperclip==1.8.2",
    "Pillow==10.2.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true