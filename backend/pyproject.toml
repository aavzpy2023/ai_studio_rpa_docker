[project]
name = "rpa-multi-account"
version = "0.1.0"
description = "Headless RPA API with FastAPI, PyAutoGUI, and Xvfb"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Andrey Vinajera"}]

dependencies = [
    # API Framework
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    
    # DI Container
    "kink>=0.8.0",
    
    # RPA & Computer Vision Core
    "PyAutoGUI==0.9.54",
    "opencv-python-headless==4.9.0.80",  # CRÍTICO: Versión headless para Docker
    "pyperclip==1.8.2",
    "Pillow==10.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# =========== ⭐ RUFF SETTINGS ===========
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["src"]

# =========== 🛡️ MYPY SETTINGS ===========
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true