# Enterprise Production Environment Topology
# Deployment: docker-compose -f docker-compose.prod.yml up -d

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data_prod:
  n8n_data_prod:
  ollama_models_prod:

services:
  # --- Persistence ---
  postgres_db:
    image: postgres:17-alpine
    container_name: ${PROJECT_NAME:-my_boilerplate}_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-my_boilerplate}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck: test:["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-my_boilerplate}"]

  # --- Migrador Efímero ---
  backend_migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ${PROJECT_NAME:-my_boilerplate}_migrator
    env_file:
      - backend/.env
    command: ["alembic", "upgrade", "head"]
    networks:
      - app_network
    depends_on:
      postgres_db:
        condition: service_healthy
    logging: *default-logging

    # --- AI Auto-Provisioner (Sidecar) ---
  ollama_init:
    image: curlimages/curl:latest
    container_name: ollama_init_prod
    # Run once and exit naturally
    restart: "no"
    user: root
    volumes:
      # Montamos el script creado previamente
      - ./_scripts/prod/init_ollama.sh:/init_ollama.sh
    networks:
      - app_network
    entrypoint: ["/bin/sh", "/init_ollama.sh"]
    depends_on:
      ollama_ai:
        condition: service_healthy
    logging: *default-logging

  # ---Aplicación Core ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ${PROJECT_NAME:-my_boilerplate}_backend
    restart: unless-stopped
    ports:
      - "8008:8000"
      - "5900:5900"
      - "6080:6080"
    env_file:
      - backend/.env
    networks:
      - app_network
    depends_on:
      postgres_db:
        condition: service_healthy
      backend_migrator:
        condition: service_completed_successfully
    logging: *default-logging

  # --- Frontend (Static React SPA) ---
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile.prod
    container_name: ${PROJECT_NAME:-my_boilerplate}_frontend
    restart: unless-stopped
    ports:
      - "3010:80"
    networks:
      - app_network
    logging: *default-logging

    # --- Unified API Gateway (Public Entrypoint) ---
  gateway:
    image: nginx:alpine
    container_name: ${PROJECT_NAME:-my_boilerplate}_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network
    depends_on:
      - frontend
      - backend
    logging: *default-logging
