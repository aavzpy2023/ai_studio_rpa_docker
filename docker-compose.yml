# Dev Environment
# Deployment: docker-compose -f docker-compose_dev.yml up -d

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data_prod:

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME:-my_boilerplate}_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-my_boilerplate}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-my_boilerplate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend_migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-my_boilerplate}_migrator
    env_file:
      - backend/.env
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    networks:
      - app_network
    depends_on:
      postgres_db:
        condition: service_healthy
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-my_boilerplate}_backend
    restart: unless-stopped
    ports:
      - "8008:8000"
      - "127.0.0.1:5900:5900" # Expose VNC securely to localhost only
      - "127.0.0.1:6080:6080" # Expose Web VNC (noVNC) bridge to localhost
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app/backend
      - ./data/profiles:/data/profiles
    networks:
      - app_network
    depends_on:
      postgres_db:
        condition: service_healthy
      backend_migrator:
        condition: service_completed_successfully
    logging: *default-logging

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-my_boilerplate}_frontend
    restart: unless-stopped
    ports:
      - "3010:3000"
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    networks:
      - app_network
    logging: *default-logging

  gateway:
    image: nginx:alpine
    container_name: ${PROJECT_NAME:-my_boilerplate}_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network
    depends_on:
      - frontend
      - backend
    logging: *default-logging
